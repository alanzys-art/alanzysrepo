
name: Build Athkari APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager not found at $SDKMANAGER"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      # Optional: sign every build with the same key so new APKs install over old ones.
      # If the repository secret ATHKARI_DEBUG_KEYSTORE is not set, this step does nothing and
      # Gradle uses a fresh random debug key (as before).
      - name: Use stable signing key (optional)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ATHKARI_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Stable signing key installed."
          else
            echo "No ATHKARI_DEBUG_KEYSTORE secret; using a temporary debug key."
          fi

      - name: Download background photos into the app
        run: python3 .github/scripts/fetch_photos.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athkari-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
